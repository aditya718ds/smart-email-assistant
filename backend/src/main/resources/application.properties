spring.application.name=Smart Email Assistant
server.address=127.0.0.1
server.port=8080
spring.config.import=optional:file:./config.properties
assistant.mode=${ASSISTANT_MODE:demo}
assistant.gemini.api-key=${GEMINI_API_KEY:}
assistant.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.indent-output=false
